[project]
name = "vynacode"
version = "0.1.0"
description = "Vynacode weaves together your codebase and local AI models at compact VRAM constraints."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "ollama>=0.6.2",
    "requests>=2.34.2",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "nuitka>=4.1.2",
]

[project.scripts]
vynacode = "vynacode.cli:app"

[project.license]
text = "AGPL-3.0-only OR Commercial"
